[project]
name = "snack-counter"
version = "0.1.0"
description = "Snack counter refill automation: refill lifecycle, fair volunteer assignment and budget checks across two offices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tzdata>=2025.2",  # zoneinfo has no system tz database on Windows
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
